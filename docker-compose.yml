services:
  central-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: central
      POSTGRES_USER: healthcare
      POSTGRES_PASSWORD: healthcare
    volumes:
      - central-data:/var/lib/postgresql/data

  tenant-a-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tenant_a
      POSTGRES_USER: healthcare
      POSTGRES_PASSWORD: healthcare
    volumes:
      - tenant-a-data:/var/lib/postgresql/data

  tenant-b-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tenant_b
      POSTGRES_USER: healthcare
      POSTGRES_PASSWORD: healthcare
    volumes:
      - tenant-b-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: central-db
      POSTGRES_USER: healthcare
      POSTGRES_PASSWORD: healthcare
      CENTRAL_DB_NAME: central
      TENANT_A_DB_HOST: tenant-a-db
      TENANT_A_DB_NAME: tenant_a
      TENANT_B_DB_HOST: tenant-b-db
      TENANT_B_DB_NAME: tenant_b
      DJANGO_DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1,nginx
    depends_on:
      - central-db
      - tenant-a-db
      - tenant-b-db

  frontend:
    build: ./frontend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  central-data:
  tenant-a-data:
  tenant-b-data:
