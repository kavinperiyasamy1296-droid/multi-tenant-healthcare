
services:
  backend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-south-1.amazonaws.com/healthcare-poc-backend:${IMAGE_TAG}
    container_name: healthcare-backend
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      POSTGRES_HOST: ${RDS_ENDPOINT}
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${RDS_USERNAME}
      POSTGRES_PASSWORD: ${RDS_PASSWORD}
      CENTRAL_DB_NAME: central
      TENANT_A_DB_NAME: tenant_a
      TENANT_B_DB_NAME: tenant_b
    expose:
      - "8000"

  frontend:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.ap-south-1.amazonaws.com/healthcare-poc-frontend:${IMAGE_TAG}
    container_name: healthcare-frontend
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    container_name: healthcare-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

